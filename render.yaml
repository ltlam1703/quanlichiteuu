# render.yaml — Render Blueprint
# Docs: https://render.com/docs/blueprint-spec

services:
  # ── API (Node.js) ─────────────────────────────────────────
  - type: web
    name: expense-api
    runtime: node
    rootDir: api
    buildCommand: npm ci --production
    startCommand: npm start
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3000
      - key: MONGO_URI
        sync: false          # Điền tay trên Render dashboard (không commit lên git)

  # ── Frontend (Static Site) ────────────────────────────────
  - type: web
    name: expense-frontend
    runtime: static
    rootDir: frontend
    staticPublishPath: .    # Serve thẳng thư mục frontend/
    headers:
      - path: /*
        name: Cache-Control
        value: no-cache
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
